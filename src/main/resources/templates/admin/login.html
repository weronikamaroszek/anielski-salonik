<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel administracyjny - Anielski Salonik</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

    <!-- Login page styles -->
    <link rel="stylesheet" th:href="@{/css/admin/login.css}">
</head>
<body>

    <div class="login-container">

        <img th:src="@{/images/logo.png}" alt="Anielski Salonik" class="login-logo">

        <h1 class="login-title">Panel administracyjny</h1>
        <p class="login-subtitle">Zaloguj się, aby kontynuować</p>

        <!-- Login error message -->
        <div th:if="${param.error}" class="login-message error">
            Nieprawidłowy login lub hasło
        </div>

        <!-- Logout success message -->
        <div th:if="${param.logout}" class="login-message success">
            Zostałaś wylogowana
        </div>

        <form class="login-form" th:action="@{/admin/login}" method="post">
            <input type="text" name="username" placeholder="Login" class="login-input" required autofocus>
            <input type="password" name="password" placeholder="Hasło" class="login-input" required>
            <button type="submit" class="login-button">Zaloguj</button>
        </form>

        <a th:href="@{/}" class="login-back">← Wróć na stronę</a>

    </div>

</body>
</html>
