<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Footer - all texts loaded from the database (site_content table). -->
<!-- Editable via the admin panel at /admin/layout. -->
<footer th:fragment="footer" class="footer">
    <div class="container footer-inner">
        <div class="footer-left">
            <img th:src="@{/images/logo.png}" alt="Anielski Salonik" height="40">
            <span th:text="${content.footerCopyright}"></span>
        </div>
        <div class="footer-right">
            <a th:href="'tel:' + ${content.footerPhone}" th:text="${content.footerPhone}"></a>
            <a th:href="${content.footerFacebookUrl}" target="_blank">Facebook</a>
            <i data-lucide="paw-print"></i>
        </div>
    </div>
</footer>

</body>
</html>
