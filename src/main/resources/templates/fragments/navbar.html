<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Navigation bar - menu items are loaded from the database (menu_items table). -->
<!-- Editable via the admin panel at /admin/layout. -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img th:src="@{/images/logo.png}" alt="Anielski Salonik" height="50">
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto align-items-center">

                <!-- Regular menu links (loop over items where isButton = false) -->
                <li th:each="item : ${menuItems}" th:if="${!item.isButton}" class="nav-item">
                    <a class="nav-link" th:href="${item.url}" th:text="${item.label}"></a>
                </li>

                <!-- CTA button items (loop over items where isButton = true) -->
                <li th:each="item : ${menuItems}" th:if="${item.isButton}" class="nav-item ms-2">
                    <a class="btn btn-gold" th:href="${item.url}" th:text="${item.label}"></a>
                </li>

            </ul>
        </div>
    </div>
</nav>

</body>
</html>
