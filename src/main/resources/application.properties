# ==========================================
# ANIELSKI SALONIK - Application Config
# ==========================================

spring.application.name=anielski-salonik

# ==========================================
# Database (H2 - file mode)
# Data is stored in ./data/anielski-db and survives restarts
# ==========================================
spring.datasource.url=jdbc:h2:file:./data/anielski-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# JPA / Hibernate
# Auto-creates and updates tables from entity classes
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==========================================
# H2 Console (browser access to the database - DEV ONLY!)
# Available at: http://localhost:8080/h2-console
# TODO: Disable before production deployment on OVH
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console